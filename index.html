<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4f46e5" />
    <title>DartNest — Offline Flutter & Dart Academy</title>
    <meta name="description" content="120-lesson complete Flutter and Dart academy with an in-browser Dart interpreter, widget preview, exams and practical labs." />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Apple / iOS PWA support -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DartNest" />
    <link rel="apple-touch-icon" href="/icon-512.jpg" />

    <!-- Android / Open Graph -->
    <meta name="application-name" content="DartNest" />
    <meta property="og:title" content="DartNest" />
    <meta property="og:description" content="120-lesson complete Flutter and Dart academy." />
    <meta property="og:image" content="/icon-512.jpg" />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('SW registered:', reg.scope))
            .catch(err => console.warn('SW registration failed:', err));
        });
      }
    </script>
  </body>
</html>
